<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus Info · Everything a senior would tell you</title>
  <meta name="description" content="Everything a senior would tell you: what you need to know, where you need to go, what you can explore and whom you can reach out to at IIT Madras. Written by students from official sources. Works offline.">
  <meta name="theme-color" content="#fbf8f2" id="theme-color">
  <script>
    // Light or dark before anything is drawn: the reader's own choice, else the phone's setting.
    (function () {
      var t = null;
      try { t = localStorage.getItem("ci.theme"); } catch (e) { /* private mode */ }
      if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
      if (t === "dark") document.getElementById("theme-color").setAttribute("content", "#15130f");
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta property="og:title" content="Campus Info">
  <meta property="og:description" content="Everything a senior would tell you. Search in your own words; every number taps to call.">
  <meta property="og:image" content="icons/icon-512.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="masthead">
    <header class="top">
      <a class="brand" href="#/" aria-label="Campus Info home">
        <svg class="logo" viewBox="0 0 32 40" aria-hidden="true"><path d="M2 4a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v35l-14-8.5L2 39z" fill="var(--logo)"/></svg>
        <span class="words"><span class="name">Campus Info</span><span class="tag">Everything a senior would tell you.</span></span>
      </a>
      <a class="whatis" href="#/about" data-nav="about"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4.5M12 8h.01"/></svg>What is this?</a>
      <button type="button" class="theme" id="theme" aria-label="Switch to dark mode">
        <svg class="ic moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
        <svg class="ic sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/topics" data-nav="topics">Topics</a>
      <a href="#/emergency" data-nav="emergency" class="sos">Emergency</a>
      <a href="#" id="nav-feedback" data-nav="feedback" data-feedback="nav" target="_blank" rel="noopener">Feedback</a>
    </nav>
  </div>
  <main id="main" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>
  <!-- An older offline copy of app.js still writes the emergency strip here; keeping the empty slot means a phone
       that mixes old and new files on a slow connection still opens instead of stopping at "Loading…". -->
  <div id="strip" hidden></div>
  <div class="rail" id="rail" aria-hidden="true" hidden></div>
  <div class="bubble" id="bubble" aria-hidden="true" hidden></div>
  <footer class="foot" id="foot"></footer>
  <noscript><p class="loading">Campus Info needs JavaScript turned on.</p></noscript>
  <script src="markdown.js" defer></script>
  <script src="search.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
